server:
  port: 8083

spring:
  application:
    name: API-GATEWAY
  http:
      clients:
        connect-timeout: 5s
        read-timeout: 10s

  cloud:
    gateway:
      server:
        webmvc:
          use-framework-retry-filter: true

          routes:

            # Product Service
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products,/api/products/**
              filters:
                - StripPrefix=1

            # Inventory Service
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory,/api/inventory/**
              filters:
                - StripPrefix=1							
resilience4j:
  circuitbreaker:
    instances:
      recommendationCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true	
  timelimiter:
    instances:
      recommendationCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
app:
  rate-limit:
    capacity: 100
    window-seconds: 60