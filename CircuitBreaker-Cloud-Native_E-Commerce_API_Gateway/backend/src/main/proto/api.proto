syntax = "proto3";

option java_multiple_files = true;
option java_package = "Server.backend.proto";
option java_outer_classname = "InventoryApi";

package inventory;

service InventoryService {

    rpc GetInventory(GetInventoryRequest)
            returns (InventoryResponse);

    rpc GetAllInventory(GetAllInventoryRequest)
            returns (InventoryListResponse);
}

message GetInventoryRequest {
    int64 productId = 1;
}

message GetAllInventoryRequest {
}

message InventoryResponse {
    int64 productId = 1;
    int32 availableQuantity = 2;
    string status = 3;
}

message InventoryListResponse {
    repeated InventoryResponse inventory = 1;
}